<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Log — VoteGuard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>@media print { #sidebar, #topbar, .no-print { display: none !important; } .app-main { margin: 0 !important; } }</style>
</head>
<body>
<div id="sidebar" class="no-print"></div>
<div id="topbar" class="no-print"></div>

<main class="app-main">
  <div class="d-flex justify-content-end mb-3 flex-wrap gap-2 no-print">
    <button class="btn btn-outline-secondary rounded-3" onclick="exportCsv()"><i class="bi bi-filetype-csv me-1"></i>Export CSV</button>
    <button class="btn btn-outline-secondary rounded-3" onclick="window.print()"><i class="bi bi-file-earmark-pdf me-1"></i>Export PDF</button>
    <button class="btn btn-vg-primary rounded-3" onclick="verifyChain()"><i class="bi bi-shield-check me-1"></i>Verify Chain</button>
  </div>

  <div id="chainBanner" class="chain-banner mb-4 d-none"></div>

  <div class="card-vg p-4 fade-in">
    <div class="table-responsive">
      <table class="table table-vg align-middle">
        <thead><tr><th>Time</th><th>Action</th><th>Actor</th><th>Details</th></tr></thead>
        <tbody id="logTableBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
requireRoleOrRedirect('election_official', 'auditor');
renderAppShell('Audit Log');

let currentLogs = [];

async function loadLogs() {
  currentLogs = await apiFetch('/audit/logs');
  document.getElementById('logTableBody').innerHTML = currentLogs.slice().reverse().map(l => `
    <tr>
      <td class="text-nowrap">${new Date(l.timestamp).toLocaleString()}</td>
      <td><span class="pill info">${escapeHtml(l.action)}</span></td>
      <td>${escapeHtml(l.actor)}</td>
      <td class="text-muted-sm">${escapeHtml(JSON.stringify(l.details))}</td>
    </tr>`).join('') || `<tr><td colspan="4" class="text-center text-muted-sm py-3">No log entries yet.</td></tr>`;
}

async function verifyChain() {
  try {
    const data = await apiFetch('/audit/verify-chain');
    const banner = document.getElementById('chainBanner');
    banner.classList.remove('d-none');
    if (data.intact) {
      banner.className = 'chain-banner ok mb-4';
      banner.innerHTML = `<i class="bi bi-shield-check fs-4"></i> Audit log chain intact across ${data.totalEntries} entries. No tampering detected.`;
    } else {
      banner.className = 'chain-banner bad mb-4';
      banner.innerHTML = `<i class="bi bi-shield-x fs-4"></i> Tampering detected in ${data.breaks.length} entr${data.breaks.length === 1 ? 'y' : 'ies'}. See console for details.`;
      console.warn('Audit chain breaks:', data.breaks);
    }
  } catch (err) {
    showAlert('chainBanner', err.message, 'error');
  }
}

function exportCsv() {
  const csv = toCsv(
    currentLogs.map(l => ({ timestamp: l.timestamp, action: l.action, actor: l.actor, details: JSON.stringify(l.details) })),
    ['timestamp', 'action', 'actor', 'details']
  );
  downloadTextFile('voteguard-audit-log.csv', csv);
}

loadLogs();
</script>
</body>
</html>
