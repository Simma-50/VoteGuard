<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cast Vote — VoteGuard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="sidebar"></div>
<div id="topbar"></div>

<main class="app-main" style="max-width: 780px;">
  <ul class="vg-stepper" id="stepper"></ul>

  <div id="statusAlert" class="alert d-none mb-4"></div>

  <div id="ballotCard" class="card-vg p-4 fade-in d-none">
    <div class="card-header-vg"><i class="bi bi-card-checklist"></i>Board Director Election — Select a Candidate</div>
    <div id="candidateList" class="d-flex flex-column gap-3 mb-3"></div>
    <button id="submitVote" class="btn btn-vg-primary w-100 rounded-3 py-2 d-none" onclick="submitVote()">
      <i class="bi bi-shield-lock me-2"></i>Encrypt, Sign &amp; Submit Vote
    </button>
  </div>

  <div id="processingCard" class="card-vg p-4 fade-in d-none text-center">
    <h5 class="fw-bold mb-4">Processing Your Ballot</h5>
    <ul class="process-steps mx-auto" style="max-width: 320px; text-align:left;" id="processSteps">
      <li data-step="encrypt"><div class="icon-wrap"><i class="bi bi-lock"></i></div>Encrypting ballot (AES-256)</li>
      <li data-step="hash"><div class="icon-wrap"><i class="bi bi-hash"></i></div>Hashing ciphertext (SHA-256)</li>
      <li data-step="sign"><div class="icon-wrap"><i class="bi bi-pen"></i></div>Signing with your private key</li>
      <li data-step="save"><div class="icon-wrap"><i class="bi bi-save"></i></div>Recording your ballot</li>
      <li data-step="receipt"><div class="icon-wrap"><i class="bi bi-receipt"></i></div>Generating your receipt</li>
    </ul>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
requireRoleOrRedirect('voter');
renderAppShell('Cast Vote');
renderStepper('vote');

let selectedCandidate = null;

async function load() {
  try {
    const status = await apiFetch('/voter/status');
    const { election, candidates } = await apiFetch('/voter/candidates');

    if (status.hasVoted) {
      showAlert('statusAlert', '<i class="bi bi-check-circle me-2"></i>You have already cast your vote in this election.', 'info');
      return;
    }
    if (election.status !== 'open') {
      showAlert('statusAlert', `<i class="bi bi-lock me-2"></i>Voting is currently ${election.status}.`, 'warning');
      return;
    }
    if (!status.certificateValid) {
      showAlert('statusAlert', `<i class="bi bi-x-circle me-2"></i>Your certificate is not valid: ${status.certificateStatus}`, 'error');
      return;
    }

    document.getElementById('ballotCard').classList.remove('d-none');
    const listEl = document.getElementById('candidateList');
    candidates.forEach(c => {
      const initials = c.name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
      const div = document.createElement('div');
      div.className = 'candidate-card d-flex align-items-center justify-content-between';
      div.innerHTML = `
        <div class="d-flex align-items-center gap-3">
          <div class="candidate-avatar">${initials}</div>
          <div>
            <div class="fw-semibold">${escapeHtml(c.name)}</div>
            <div class="text-muted-sm">${escapeHtml(c.party)}</div>
          </div>
        </div>
        <i class="bi bi-circle fs-5 text-muted select-indicator"></i>`;
      div.onclick = () => {
        document.querySelectorAll('.candidate-card').forEach(el => {
          el.classList.remove('selected');
          el.querySelector('.select-indicator').className = 'bi bi-circle fs-5 text-muted select-indicator';
        });
        div.classList.add('selected');
        div.querySelector('.select-indicator').className = 'bi bi-check-circle-fill fs-5 text-primary select-indicator';
        selectedCandidate = c.id;
        document.getElementById('submitVote').classList.remove('d-none');
      };
      listEl.appendChild(div);
    });
  } catch (err) {
    showAlert('statusAlert', err.message, 'error');
  }
}

async function submitVote() {
  if (!selectedCandidate) return;
  document.getElementById('ballotCard').classList.add('d-none');
  document.getElementById('processingCard').classList.remove('d-none');

  const steps = ['encrypt', 'hash', 'sign', 'save', 'receipt'];
  let apiResult = null, apiError = null;

  const apiPromise = apiFetch('/voter/vote', { method: 'POST', body: JSON.stringify({ candidateId: selectedCandidate }) })
    .then(d => { apiResult = d; })
    .catch(e => { apiError = e; });

  for (let i = 0; i < steps.length; i++) {
    const li = document.querySelector(`[data-step="${steps[i]}"]`);
    document.querySelectorAll('.process-steps li').forEach(el => el.classList.remove('active'));
    li.classList.add('active');
    await new Promise(r => setTimeout(r, 450));
    li.classList.remove('active');
    li.classList.add('done');
    li.querySelector('.icon-wrap').innerHTML = '<i class="bi bi-check-lg"></i>';
  }

  await apiPromise;

  if (apiError) {
    document.getElementById('processingCard').classList.add('d-none');
    showAlert('statusAlert', apiError.message, 'error');
    return;
  }

  sessionStorage.setItem('vg_last_receipt', JSON.stringify(apiResult));
  window.location.href = '/receipt.html';
}

load();
</script>
</body>
</html>
