<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vote Receipt — VoteGuard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>@media print { #sidebar, #topbar, .no-print { display: none !important; } .app-main { margin: 0 !important; } }</style>
</head>
<body>
<div id="sidebar" class="no-print"></div>
<div id="topbar" class="no-print"></div>

<main class="app-main" style="max-width: 640px;">
  <ul class="vg-stepper no-print" id="stepper"></ul>

  <div class="card-vg p-4 p-lg-5 text-center fade-in" id="receiptCard">
    <div class="stat-icon green mx-auto mb-3" style="width:60px;height:60px;font-size:1.7rem;"><i class="bi bi-receipt"></i></div>
    <h4 class="fw-bold mb-1">Vote Recorded Successfully</h4>
    <p class="text-muted-sm">Your ballot was encrypted and digitally signed before being saved. Keep this receipt to verify its integrity later.</p>

    <div class="widget-row my-4 text-start" style="word-break: break-all;">
      <div>
        <div class="text-muted-sm mb-1">Receipt Code</div>
        <div class="fw-bold" id="receiptOut" style="font-family: monospace;">—</div>
      </div>
    </div>

    <div class="d-flex gap-2 justify-content-center flex-wrap no-print">
      <button class="btn btn-outline-secondary rounded-3" onclick="downloadReceipt()"><i class="bi bi-download me-1"></i>Download</button>
      <button class="btn btn-outline-secondary rounded-3" onclick="window.print()"><i class="bi bi-printer me-1"></i>Print</button>
      <a href="/verify.html" class="btn btn-vg-primary rounded-3"><i class="bi bi-shield-check me-1"></i>Verify Now</a>
    </div>
  </div>

  <div class="card-vg p-4 mt-4 fade-in no-print">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-info-circle text-primary"></i>
      <span class="text-muted-sm">This receipt does not reveal your candidate choice — it only proves your ballot exists and is untampered.</span>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
requireRoleOrRedirect('voter');
renderAppShell('Vote Receipt');
renderStepper('vote');

const raw = sessionStorage.getItem('vg_last_receipt');
if (!raw) {
  window.location.href = '/voter-dashboard.html';
} else {
  const data = JSON.parse(raw);
  document.getElementById('receiptOut').textContent = data.receipt;
}

function downloadReceipt() {
  const data = JSON.parse(sessionStorage.getItem('vg_last_receipt') || '{}');
  downloadTextFile(`voteguard-receipt-${(data.receipt || 'unknown').slice(0, 12)}.txt`,
    `VoteGuard Vote Receipt\n\nReceipt: ${data.receipt}\nVote ID: ${data.voteId}\n\nKeep this receipt to verify your vote's integrity at any time.`);
}
</script>
</body>
</html>
