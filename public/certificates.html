<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificates — VoteGuard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="sidebar"></div>
<div id="topbar"></div>

<main class="app-main">
  <div class="d-flex justify-content-end mb-3">
    <button class="btn btn-outline-secondary rounded-3" onclick="downloadCaCert()"><i class="bi bi-download me-1"></i>Download Root CA Certificate</button>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card-vg hover-lift p-3 fade-in">
        <div class="stat-icon blue mb-2"><i class="bi bi-patch-check"></i></div>
        <div class="stat-value" id="totalCerts">—</div>
        <div class="stat-label">Total Certificates</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card-vg hover-lift p-3 fade-in">
        <div class="stat-icon green mb-2"><i class="bi bi-check-circle"></i></div>
        <div class="stat-value" id="activeCerts">—</div>
        <div class="stat-label">Active</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card-vg hover-lift p-3 fade-in">
        <div class="stat-icon red mb-2"><i class="bi bi-x-circle"></i></div>
        <div class="stat-value" id="revokedCerts">—</div>
        <div class="stat-label">Revoked</div>
      </div>
    </div>
  </div>

  <div class="card-vg p-4 fade-in">
    <div class="card-header-vg"><i class="bi bi-list-ul"></i>Issued Certificates</div>
    <div class="table-responsive">
      <table class="table table-vg align-middle">
        <thead><tr><th>Serial</th><th>Owner</th><th>Role</th><th>Issued</th><th>Expires</th><th>Status</th></tr></thead>
        <tbody id="certTableBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
requireRoleOrRedirect('election_official', 'auditor');
renderAppShell('Certificate Repository');

async function load() {
  const certs = await apiFetch('/audit/certificates');
  const active = certs.filter(c => !c.revoked).length;
  document.getElementById('totalCerts').textContent = certs.length;
  document.getElementById('activeCerts').textContent = active;
  document.getElementById('revokedCerts').textContent = certs.length - active;

  document.getElementById('certTableBody').innerHTML = certs.map(c => `
    <tr>
      <td><code>${c.serial}</code></td>
      <td class="fw-semibold">${escapeHtml(c.owner)}</td>
      <td><span class="pill neutral">${escapeHtml(c.role)}</span></td>
      <td>${new Date(c.issuedAt).toLocaleDateString()}</td>
      <td>${new Date(c.expiresAt).toLocaleDateString()}</td>
      <td>${c.revoked ? '<span class="pill bad"><i class="bi bi-x-circle"></i> Revoked</span>' : '<span class="pill ok"><i class="bi bi-check-circle"></i> Active</span>'}</td>
    </tr>`).join('') || `<tr><td colspan="6" class="text-center text-muted-sm py-3">No certificates issued yet.</td></tr>`;
}

async function downloadCaCert() {
  const res = await fetch('/api/audit/ca-certificate', { headers: { Authorization: 'Bearer ' + getToken() } });
  const text = await res.text();
  downloadTextFile('voteguard-root-ca.pem', text);
}

load();
</script>
</body>
</html>
