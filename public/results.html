<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results — VoteGuard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="sidebar"></div>
<div id="topbar"></div>

<main class="app-main">
  <ul class="vg-stepper" id="stepper"></ul>

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
      <h5 class="fw-bold mb-0" id="electionTitle">Results</h5>
      <p class="text-muted-sm mb-0" id="electionStatusText"></p>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card-vg hover-lift p-3 fade-in">
        <div class="stat-icon blue mb-2"><i class="bi bi-inboxes"></i></div>
        <div class="stat-value" id="totalBallots">—</div>
        <div class="stat-label">Total Ballots Cast</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card-vg hover-lift p-3 fade-in">
        <div class="stat-icon green mb-2"><i class="bi bi-check-circle"></i></div>
        <div class="stat-value" id="validVotes">—</div>
        <div class="stat-label">Valid &amp; Counted</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card-vg hover-lift p-3 fade-in">
        <div class="stat-icon red mb-2"><i class="bi bi-exclamation-triangle"></i></div>
        <div class="stat-value" id="invalidVotes">—</div>
        <div class="stat-label">Flagged / Invalid</div>
      </div>
    </div>
  </div>

  <div class="row g-4 mb-4">
    <div class="col-lg-6">
      <div class="card-vg p-4 fade-in h-100">
        <div class="card-header-vg"><i class="bi bi-bar-chart"></i>Vote Distribution</div>
        <canvas id="resultsChart" height="220"></canvas>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="card-vg p-4 fade-in h-100">
        <div class="card-header-vg"><i class="bi bi-table"></i>Candidate Breakdown</div>
        <div class="table-responsive">
          <table class="table table-vg align-middle mb-0">
            <thead><tr><th>Candidate</th><th>Position</th><th>Votes</th></tr></thead>
            <tbody id="resultsTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="issuesCard" class="card-vg p-4 fade-in d-none">
    <div class="card-header-vg text-danger"><i class="bi bi-exclamation-triangle"></i>Integrity Issues Detected</div>
    <div class="table-responsive">
      <table class="table table-vg align-middle mb-0">
        <thead><tr><th>Vote ID</th><th>Reason</th></tr></thead>
        <tbody id="issuesTableBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="/js/common.js"></script>
<script>
requireRoleOrRedirect('election_official', 'auditor');
renderAppShell('Results');
renderStepper('results');

async function load() {
  const data = await apiFetch('/audit/results');
  document.getElementById('electionTitle').textContent = data.election.title;
  document.getElementById('electionStatusText').textContent = `Currently ${data.election.status}`;
  document.getElementById('totalBallots').textContent = data.totalBallotsCast;
  document.getElementById('validVotes').textContent = data.validVotesCounted;
  document.getElementById('invalidVotes').textContent = data.invalidOrTamperedVotes;

  document.getElementById('resultsTableBody').innerHTML = data.results.map(r => `
    <tr><td class="fw-semibold">${escapeHtml(r.name)}</td><td>${escapeHtml(r.party)}</td><td>${r.votes}</td></tr>`).join('')
    || `<tr><td colspan="3" class="text-center text-muted-sm py-3">No candidates.</td></tr>`;

  new Chart(document.getElementById('resultsChart'), {
    type: 'bar',
    data: {
      labels: data.results.map(r => r.name),
      datasets: [{ label: 'Votes', data: data.results.map(r => r.votes), backgroundColor: '#2f6fed', borderRadius: 6 }]
    },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
  });

  if (data.integrityIssues.length > 0) {
    document.getElementById('issuesCard').classList.remove('d-none');
    document.getElementById('issuesTableBody').innerHTML = data.integrityIssues.map(i => `
      <tr><td><code>${i.voteId}</code></td><td>${escapeHtml(i.reason)}</td></tr>`).join('');
  }
}
load();
</script>
</body>
</html>
