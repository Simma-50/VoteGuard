<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify Vote — VoteGuard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="sidebar"></div>
<div id="topbar"></div>

<main class="app-main" style="max-width: 800px;">
  <ul class="vg-stepper" id="stepper"></ul>

  <div class="card-vg p-4 fade-in mb-4">
    <div class="card-header-vg"><i class="bi bi-search"></i>Verify Your Vote</div>
    <form id="verifyForm" class="d-flex gap-2 flex-wrap">
      <input type="text" class="form-control" id="receipt" placeholder="Paste your receipt code" style="flex: 1; min-width: 240px;" required>
      <button type="submit" class="btn btn-vg-primary rounded-3 px-4"><i class="bi bi-shield-check me-1"></i>Verify</button>
    </form>
    <div id="alertBox" class="alert d-none mt-3"></div>
  </div>

  <div id="resultsGrid" class="row g-3 d-none">
    <div class="col-md-6">
      <div class="card-vg p-4 hover-lift fade-in">
        <div class="d-flex align-items-center gap-3">
          <div class="stat-icon blue"><i class="bi bi-patch-check"></i></div>
          <div><div class="stat-label">Certificate</div><div id="rCert"></div></div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card-vg p-4 hover-lift fade-in">
        <div class="d-flex align-items-center gap-3">
          <div class="stat-icon teal"><i class="bi bi-pen"></i></div>
          <div><div class="stat-label">Signature</div><div id="rSig"></div></div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card-vg p-4 hover-lift fade-in">
        <div class="d-flex align-items-center gap-3">
          <div class="stat-icon slate"><i class="bi bi-hash"></i></div>
          <div><div class="stat-label">Hash Integrity</div><div id="rHash"></div></div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card-vg p-4 hover-lift fade-in">
        <div class="d-flex align-items-center gap-3">
          <div class="stat-icon amber"><i class="bi bi-receipt"></i></div>
          <div><div class="stat-label">Receipt Match</div><div id="rReceipt"></div></div>
        </div>
      </div>
    </div>
    <div class="col-12">
      <div class="card-vg p-4 fade-in">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
          <div>
            <div class="fw-semibold">Overall Integrity Status</div>
            <div class="text-muted-sm">Recorded at <span id="rTime">—</span></div>
          </div>
          <div id="rOverall"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
requireRoleOrRedirect('voter', 'election_official', 'auditor');
renderAppShell('Verify Vote');
renderStepper('verify');

document.getElementById('verifyForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const receipt = document.getElementById('receipt').value.trim();
  hideAlert('alertBox');
  try {
    const data = await apiFetch('/voter/verify-receipt', { method: 'POST', body: JSON.stringify({ receipt }) });
    document.getElementById('resultsGrid').classList.remove('d-none');

    const pill = (ok, okText, badText) => ok
      ? `<span class="pill ok"><i class="bi bi-check-circle"></i> ${okText}</span>`
      : `<span class="pill bad"><i class="bi bi-x-circle"></i> ${badText}</span>`;

    document.getElementById('rCert').innerHTML = pill(data.certificateValid, 'Valid', data.certificateStatus);
    document.getElementById('rSig').innerHTML = pill(data.signatureValid, 'Valid', 'Invalid');
    document.getElementById('rHash').innerHTML = pill(data.hashIntact, 'Intact', 'Tampered');
    document.getElementById('rReceipt').innerHTML = pill(true, 'Found', 'Not Found');
    document.getElementById('rTime').textContent = new Date(data.timestamp).toLocaleString();
    document.getElementById('rOverall').innerHTML = data.integrityConfirmed
      ? '<span class="pill ok fs-6"><i class="bi bi-shield-check"></i> Confirmed</span>'
      : '<span class="pill bad fs-6"><i class="bi bi-shield-x"></i> Failed</span>';
  } catch (err) {
    document.getElementById('resultsGrid').classList.add('d-none');
    showAlert('alertBox', err.message, 'error');
  }
});
</script>
</body>
</html>
