<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — VoteGuard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="sidebar"></div>
<div id="topbar"></div>

<main class="app-main">
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card-vg hover-lift p-4 fade-in">
        <div class="d-flex align-items-center gap-3">
          <div class="stat-icon blue"><i class="bi bi-patch-check"></i></div>
          <div><div class="stat-label">Certificate</div><div id="certStatusPill"><span class="pill neutral">Checking</span></div></div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card-vg hover-lift p-4 fade-in">
        <div class="d-flex align-items-center gap-3">
          <div class="stat-icon teal"><i class="bi bi-flag"></i></div>
          <div><div class="stat-label">Election</div><div id="electionStatusPill"><span class="pill neutral">Checking</span></div></div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card-vg hover-lift p-4 fade-in">
        <div class="d-flex align-items-center gap-3">
          <div class="stat-icon slate"><i class="bi bi-check2-square"></i></div>
          <div><div class="stat-label">Voting Status</div><div id="votingStatusPill"><span class="pill neutral">Checking</span></div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card-vg p-4 fade-in h-100">
        <div class="card-header-vg"><i class="bi bi-clock-history"></i>Recent Activity</div>
        <ul class="list-unstyled d-flex flex-column gap-3 mb-0" id="activityList"></ul>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card-vg p-4 fade-in h-100">
        <div class="card-header-vg"><i class="bi bi-lightning"></i>Quick Actions</div>
        <div class="d-flex flex-column gap-2">
          <a href="/vote.html" class="btn btn-vg-primary rounded-3 text-start px-3"><i class="bi bi-check2-square me-2"></i>Cast Your Vote</a>
          <a href="/verify.html" class="btn btn-outline-secondary rounded-3 text-start px-3"><i class="bi bi-shield-check me-2"></i>Verify a Receipt</a>
          <a href="/certificate.html" class="btn btn-outline-secondary rounded-3 text-start px-3"><i class="bi bi-patch-check me-2"></i>View My Certificate</a>
          <a href="/profile.html" class="btn btn-outline-secondary rounded-3 text-start px-3"><i class="bi bi-person-circle me-2"></i>My Profile</a>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
requireRoleOrRedirect('voter');
renderAppShell('Dashboard');

function pill(ok, okText, badText) {
  return ok ? `<span class="pill ok"><i class="bi bi-check-circle"></i> ${okText}</span>`
            : `<span class="pill bad"><i class="bi bi-x-circle"></i> ${badText}</span>`;
}

async function load() {
  const activity = [];
  const notifications = [];

  try {
    const status = await apiFetch('/voter/status');
    document.getElementById('certStatusPill').innerHTML = pill(status.certificateValid, 'Valid', status.certificateStatus);
    document.getElementById('votingStatusPill').innerHTML = status.hasVoted
      ? '<span class="pill ok"><i class="bi bi-check-circle"></i> Vote Cast</span>'
      : '<span class="pill warn"><i class="bi bi-hourglass"></i> Not Voted</span>';

    activity.push({ icon: 'bi-patch-check', color: 'blue', text: `Certificate ${status.certSerial} is ${status.certificateValid ? 'active and valid' : 'not valid'}` });
    activity.push({ icon: status.hasVoted ? 'bi-check2-square' : 'bi-hourglass', color: status.hasVoted ? 'green' : 'amber',
      text: status.hasVoted ? 'You have cast your vote in this election' : 'You have not yet cast your vote' });

    if (!status.certificateValid) {
      notifications.push({ level: 'danger', text: `Your certificate is not valid: ${status.certificateStatus}` });
    }

    const { election } = await apiFetch('/voter/candidates');
    const open = election.status === 'open';
    document.getElementById('electionStatusPill').innerHTML = open
      ? '<span class="pill ok"><i class="bi bi-check-circle"></i> Open</span>'
      : '<span class="pill neutral"><i class="bi bi-lock"></i> Closed</span>';
    activity.push({ icon: 'bi-flag', color: 'teal', text: `"${election.title}" is currently ${election.status}` });

    if (open && !status.hasVoted) {
      notifications.push({ level: 'info', text: 'Voting is open — you have not yet cast your ballot.' });
    }
    if (!open && !status.hasVoted) {
      notifications.push({ level: 'warning', text: 'Voting has closed and no ballot was recorded for your account.' });
    }
  } catch (err) {
    document.getElementById('certStatusPill').innerHTML = '<span class="pill bad">Unavailable</span>';
  }

  document.getElementById('activityList').innerHTML = activity.map(a => `
    <li class="d-flex gap-3">
      <div class="stat-icon ${a.color}" style="width:34px;height:34px;font-size:.95rem;"><i class="bi ${a.icon}"></i></div>
      <div class="pt-1 small">${a.text}</div>
    </li>`).join('') || '<li class="text-muted-sm">No recent activity to show.</li>';

  setNotifications(notifications);
}
load();
</script>
</body>
</html>
