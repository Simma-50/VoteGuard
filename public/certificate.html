<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Certificate — VoteGuard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="sidebar"></div>
<div id="topbar"></div>

<main class="app-main" style="max-width: 760px;">
  <div class="card-vg p-4 fade-in mb-3">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
      <div class="d-flex align-items-center gap-3">
        <div class="stat-icon blue"><i class="bi bi-patch-check"></i></div>
        <div><div class="text-muted-sm">Certificate Serial</div><div class="fw-bold" id="serialOut">—</div></div>
      </div>
      <div id="statusPill"><span class="pill neutral">Checking</span></div>
    </div>
  </div>

  <div class="card-vg p-4 fade-in">
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <div class="widget-row"><div class="text-muted-sm">Issued</div><div class="fw-semibold" id="issuedOut">—</div></div>
      </div>
      <div class="col-md-6">
        <div class="widget-row"><div class="text-muted-sm">Expires</div><div class="fw-semibold" id="expiresOut">—</div></div>
      </div>
    </div>
    <div class="adv-toggle mb-2" id="advToggle" onclick="toggleAdvanced()">
      <i class="bi bi-chevron-right"></i> Advanced Details (Certificate)
    </div>
    <div id="advPanel" class="d-none"><div id="advContent"></div></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
requireRoleOrRedirect('voter');
renderAppShell('My Certificate');

let lastCertPem = null;
let lastSerial = null;

async function load() {
  try {
    const cert = await apiFetch('/voter/certificate');
    document.getElementById('serialOut').textContent = cert.serial;
    document.getElementById('issuedOut').textContent = new Date(cert.issuedAt).toLocaleDateString();
    document.getElementById('expiresOut').textContent = new Date(cert.expiresAt).toLocaleDateString();
    document.getElementById('statusPill').innerHTML = cert.certificateValid
      ? '<span class="pill ok"><i class="bi bi-check-circle"></i> Valid</span>'
      : `<span class="pill bad"><i class="bi bi-x-circle"></i> ${cert.certificateStatus}</span>`;

    lastCertPem = cert.certPem;
    lastSerial = cert.serial;

    document.getElementById('advContent').innerHTML = `
      <label class="form-label small fw-semibold">X.509 Certificate (PEM)</label>
      <pre class="code-block mb-3">${escapeHtml(cert.certPem)}</pre>
      <button class="btn btn-outline-secondary rounded-3" onclick="downloadCert()"><i class="bi bi-download me-1"></i>Download Certificate</button>
      <p class="text-muted-sm mt-2 mb-0"><i class="bi bi-shield-lock me-1"></i>Your private signing key is held securely server-side and is never downloadable, in line with certificate custody best practice.</p>`;
  } catch (err) {
    document.getElementById('statusPill').innerHTML = `<span class="pill bad">${err.message}</span>`;
  }
}

function toggleAdvanced() {
  document.getElementById('advPanel').classList.toggle('d-none');
  document.getElementById('advToggle').classList.toggle('open');
}

function downloadCert() {
  downloadTextFile(`voteguard-certificate-${lastSerial}.pem`, lastCertPem);
}

load();
</script>
</body>
</html>
