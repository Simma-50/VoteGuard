<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify Integrity — VoteGuard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="sidebar"></div>
<div id="topbar"></div>

<main class="app-main">
  <div class="row g-4">
    <div class="col-lg-6">
      <div class="card-vg p-4 fade-in h-100">
        <div class="card-header-vg"><i class="bi bi-link-45deg"></i>Audit Chain Integrity</div>
        <p class="text-muted-sm">Recomputes the hash chain across every audit log entry to confirm none have been altered.</p>
        <button class="btn btn-vg-primary rounded-3" onclick="verifyChain()"><i class="bi bi-shield-check me-1"></i>Run Chain Verification</button>
        <div id="chainBanner" class="chain-banner mt-3 d-none"></div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="card-vg p-4 fade-in h-100">
        <div class="card-header-vg"><i class="bi bi-receipt"></i>Ballot Receipt Check</div>
        <p class="text-muted-sm">Look up any director's receipt to confirm its signature and hash are valid.</p>
        <form id="verifyForm" class="d-flex gap-2 mb-3">
          <input type="text" class="form-control" id="receipt" placeholder="Receipt code" required>
          <button type="submit" class="btn btn-outline-primary rounded-3 px-3"><i class="bi bi-search"></i></button>
        </form>
        <div id="receiptResult"></div>
        <div id="alertBox" class="alert d-none mt-2"></div>
      </div>
    </div>
  </div>

  <div class="card-vg p-4 fade-in mt-4">
    <div class="card-header-vg"><i class="bi bi-shield-x"></i>Revocation List (CRL)</div>
    <div id="crlList" class="text-muted-sm">Loading…</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
requireRoleOrRedirect('auditor', 'election_official');
renderAppShell('Verify Integrity');

async function verifyChain() {
  const banner = document.getElementById('chainBanner');
  banner.classList.remove('d-none');
  banner.className = 'chain-banner mt-3';
  banner.innerHTML = '<i class="bi bi-hourglass-split"></i> Verifying…';
  try {
    const data = await apiFetch('/audit/verify-chain');
    if (data.intact) {
      banner.className = 'chain-banner ok mt-3';
      banner.innerHTML = `<i class="bi bi-shield-check fs-4"></i> Chain intact across ${data.totalEntries} entries.`;
    } else {
      banner.className = 'chain-banner bad mt-3';
      banner.innerHTML = `<i class="bi bi-shield-x fs-4"></i> Tampering detected in ${data.breaks.length} entr${data.breaks.length === 1 ? 'y' : 'ies'}.`;
    }
  } catch (err) {
    banner.className = 'chain-banner bad mt-3';
    banner.textContent = err.message;
  }
}

document.getElementById('verifyForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const receipt = document.getElementById('receipt').value.trim();
  hideAlert('alertBox');
  try {
    const data = await apiFetch('/voter/verify-receipt', { method: 'POST', body: JSON.stringify({ receipt }) });
    const pill = (ok, okText, badText) => ok
      ? `<span class="pill ok"><i class="bi bi-check-circle"></i> ${okText}</span>`
      : `<span class="pill bad"><i class="bi bi-x-circle"></i> ${badText}</span>`;
    document.getElementById('receiptResult').innerHTML = `
      <div class="d-flex flex-column gap-2">
        <div class="d-flex justify-content-between"><span class="text-muted-sm">Certificate</span>${pill(data.certificateValid, 'Valid', data.certificateStatus)}</div>
        <div class="d-flex justify-content-between"><span class="text-muted-sm">Signature</span>${pill(data.signatureValid, 'Valid', 'Invalid')}</div>
        <div class="d-flex justify-content-between"><span class="text-muted-sm">Hash Integrity</span>${pill(data.hashIntact, 'Intact', 'Tampered')}</div>
        <div class="d-flex justify-content-between align-items-center pt-2 border-top"><span class="fw-semibold">Overall</span>${pill(data.integrityConfirmed, 'Confirmed', 'Failed')}</div>
      </div>`;
  } catch (err) {
    document.getElementById('receiptResult').innerHTML = '';
    showAlert('alertBox', err.message, 'error');
  }
});

async function loadCrl() {
  try {
    const data = await apiFetch('/audit/crl');
    document.getElementById('crlList').innerHTML = data.revokedSerials.length
      ? data.revokedSerials.map(s => `<span class="pill bad me-2 mb-2 d-inline-flex"><i class="bi bi-x-circle"></i> ${s}</span>`).join('')
      : '<span class="pill ok"><i class="bi bi-check-circle"></i> No revoked certificates</span>';
  } catch (err) {
    document.getElementById('crlList').textContent = err.message;
  }
}
loadCrl();
</script>
</body>
</html>
