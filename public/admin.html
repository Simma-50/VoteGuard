<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Election — VoteGuard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="sidebar"></div>
<div id="topbar"></div>

<main class="app-main">
  <div class="card-vg p-4 fade-in mb-4">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
      <div class="d-flex align-items-center gap-3">
        <span class="status-dot neutral" id="electionDot"></span>
        <div>
          <div class="fw-semibold" id="electionTitle">—</div>
          <div id="electionStatusPill"><span class="pill neutral">Checking</span></div>
        </div>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-success rounded-3" onclick="setElection('open')"><i class="bi bi-unlock me-1"></i>Open Voting</button>
        <button class="btn btn-outline-danger rounded-3" onclick="setElection('close')"><i class="bi bi-lock me-1"></i>Close Voting</button>
      </div>
    </div>
  </div>

  <div id="alertBox" class="alert d-none mb-4"></div>

  <div class="card-vg p-4 fade-in mb-4">
    <div class="card-header-vg"><i class="bi bi-shield-x"></i>Revoke a Certificate</div>
    <p class="text-muted-sm">Revoking adds the certificate to the revocation list. That director can no longer authenticate or vote.</p>
    <div class="row g-2">
      <div class="col-md-4"><input type="text" class="form-control" id="revokeSerial" placeholder="Certificate serial"></div>
      <div class="col-md-5"><input type="text" class="form-control" id="revokeReason" placeholder="Reason (optional)"></div>
      <div class="col-md-3"><button class="btn btn-outline-danger w-100 rounded-3" onclick="revokeCert()"><i class="bi bi-x-circle me-1"></i>Revoke</button></div>
    </div>
  </div>

  <div class="card-vg p-4 fade-in">
    <div class="card-header-vg"><i class="bi bi-people"></i>Registered Directors</div>
    <div class="table-responsive">
      <table class="table table-vg align-middle">
        <thead><tr><th>Username</th><th>Email</th><th>Certificate</th><th>Voted</th></tr></thead>
        <tbody id="voterTableBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
requireRoleOrRedirect('election_official');
renderAppShell('Manage Election');

async function loadElection() {
  const { election } = await apiFetch('/voter/candidates');
  document.getElementById('electionTitle').textContent = election.title;
  const open = election.status === 'open';
  document.getElementById('electionDot').className = 'status-dot ' + (open ? 'ok' : 'neutral');
  document.getElementById('electionStatusPill').innerHTML = open
    ? '<span class="pill ok"><i class="bi bi-check-circle"></i> Open</span>'
    : '<span class="pill neutral"><i class="bi bi-lock"></i> Closed</span>';
}

async function loadVoters() {
  const voters = await apiFetch('/admin/voters');
  document.getElementById('voterTableBody').innerHTML = voters.map(v => `
    <tr>
      <td class="fw-semibold">${escapeHtml(v.username)}</td>
      <td>${escapeHtml(v.email)}</td>
      <td><code>${v.certSerial}</code></td>
      <td>${v.hasVoted ? '<span class="pill ok"><i class="bi bi-check-circle"></i> Voted</span>' : '<span class="pill neutral">Not yet</span>'}</td>
    </tr>`).join('') || `<tr><td colspan="4" class="text-muted-sm text-center py-3">No directors registered yet.</td></tr>`;
}

async function setElection(action) {
  hideAlert('alertBox');
  try {
    const data = await apiFetch(`/admin/election/${action}`, { method: 'POST' });
    showAlert('alertBox', data.message, 'success');
    loadElection();
  } catch (err) { showAlert('alertBox', err.message, 'error'); }
}

async function revokeCert() {
  const certSerial = document.getElementById('revokeSerial').value.trim();
  const reason = document.getElementById('revokeReason').value.trim();
  hideAlert('alertBox');
  if (!certSerial) { showAlert('alertBox', 'Enter a certificate serial.', 'error'); return; }
  try {
    const data = await apiFetch('/admin/revoke-certificate', { method: 'POST', body: JSON.stringify({ certSerial, reason }) });
    showAlert('alertBox', data.message, 'success');
    document.getElementById('revokeSerial').value = '';
    document.getElementById('revokeReason').value = '';
    loadVoters();
  } catch (err) { showAlert('alertBox', err.message, 'error'); }
}

loadElection();
loadVoters();
</script>
</body>
</html>
