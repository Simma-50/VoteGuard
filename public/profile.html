<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile — VoteGuard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="sidebar"></div>
<div id="topbar"></div>

<main class="app-main" style="max-width: 760px;">
  <div class="card-vg p-4 fade-in mb-3">
    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="stat-icon blue" style="width:60px;height:60px;font-size:1.6rem;"><i class="bi bi-person"></i></div>
      <div>
        <div class="fw-bold fs-5" id="profileUsername">—</div>
        <span class="pill info"><i class="bi bi-person-badge"></i> Board Director</span>
      </div>
    </div>
    <div class="row g-3">
      <div class="col-md-6"><div class="widget-row"><div><div class="text-muted-sm">Certificate Serial</div><div class="fw-semibold" id="profileSerial">—</div></div></div></div>
      <div class="col-md-6"><div class="widget-row"><div><div class="text-muted-sm">Certificate Status</div><div id="profileCertStatus">—</div></div></div></div>
      <div class="col-md-6"><div class="widget-row"><div><div class="text-muted-sm">Voting Status</div><div id="profileVoteStatus">—</div></div></div></div>
      <div class="col-md-6"><div class="widget-row"><div><div class="text-muted-sm">Account Role</div><div class="fw-semibold">Board Director</div></div></div></div>
    </div>
  </div>

  <div class="card-vg p-4 fade-in">
    <div class="card-header-vg"><i class="bi bi-shield-lock"></i>Session</div>
    <p class="text-muted-sm mb-3">You're signed in with a short-lived session token issued after certificate and email-OTP verification.</p>
    <button class="btn btn-outline-danger rounded-3" onclick="doLogout()"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
requireRoleOrRedirect('voter');
renderAppShell('Profile');
document.getElementById('profileUsername').textContent = getUsername();

async function load() {
  try {
    const status = await apiFetch('/voter/status');
    document.getElementById('profileSerial').textContent = status.certSerial;
    document.getElementById('profileCertStatus').innerHTML = status.certificateValid
      ? '<span class="pill ok"><i class="bi bi-check-circle"></i> Valid</span>'
      : `<span class="pill bad"><i class="bi bi-x-circle"></i> ${status.certificateStatus}</span>`;
    document.getElementById('profileVoteStatus').innerHTML = status.hasVoted
      ? '<span class="pill ok"><i class="bi bi-check-circle"></i> Vote Cast</span>'
      : '<span class="pill warn"><i class="bi bi-hourglass"></i> Not Voted</span>';
  } catch (err) { /* leave placeholders */ }
}
load();
</script>
</body>
</html>
